apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip
  namespace: assignment8
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
  namespace: assignment8
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: external-service
  namespace: assignment8
spec:
  type: ExternalName
  externalName: example.com