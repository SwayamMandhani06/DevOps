apiVersion: v1
kind: PersistentVolume
metadata:
  name: assignment8-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /tmp/assignment8-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assignment8-pvc
  namespace: assignment8
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi